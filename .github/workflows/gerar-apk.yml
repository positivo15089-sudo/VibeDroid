name: Gerar APK do VibeDroid

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Extrair projeto
        run: unzip VibeDroid-Android.zip -d projeto

      - name: Compilar e verificar
        working-directory: projeto/VibeDroid
        run: gradle assembleDebug lintDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeDroid-APK
          path: projeto/VibeDroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
